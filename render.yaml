services:
  - type: web
    name: nutrition-data-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: FOOD_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REQUIRE_FIREBASE_AUTH
        value: "true"
      - key: FIREBASE_ALLOWED_UID
        sync: false
      - key: APP_USER_ID
        value: demo-user
